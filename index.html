<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Welcome to My Photo Gallery</h1>
        <p>
            This is a simple webpage demonstrating HTML, CSS, and JavaScript.
            Click any image to see its title.
        </p>

        <button id="toggleButton">Hide Gallery</button>
    </header>

    <main>
        <div id="gallery" class="gallery">
            <img src="https://picsum.photos/id/1015/400/250" alt="Mountain landscape" data-title="Mountain Landscape">
            <img src="https://picsum.photos/id/1025/400/250" alt="Cute dog" data-title="Friendly Dog">
            <img src="https://picsum.photos/id/1035/400/250" alt="Forest" data-title="Peaceful Forest">
            <img src="https://picsum.photos/id/1043/400/250" alt="Beach" data-title="Sunny Beach">
        </div>

        <p id="message"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
